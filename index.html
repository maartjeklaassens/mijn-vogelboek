ay:none}.mobile-nav{display:flex;position:fixed;z-index:5;bottom:0;background:#3d1b17;width:100%;justify-content:space-around;padding:10px 4px 14px}.mobile-nav button{border:0;color:#e2d0d7;background:transparent;font-size:11px;display:grid;justify-items:center;gap:3px}.mobile-nav button.active{color:white;font-weight:800}.main{padding:23px 16px 90px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.hero{padding:23px}.hero .bird{display:none}.top{align-items:start}.pill{font-size:10px}}@media(max-width:550px){.grid2{grid-template-columns:1fr}.birds{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.bird-info{padding:11px}.bird-top{height:95px}.bird-info b{font-size:14px}.stat{padding:14px}.stat b{font-size:28px}.filterbar .select,.search{width:100%;max-width:100%}.panel{padding:16px}}
