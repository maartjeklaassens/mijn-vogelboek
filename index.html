/* --- START SCHERM CSS --- */
#start-screen {
    position: fixed;
    inset: 0;
    background-color: white;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.5s ease-in-out;
}
#start-screen h1 {
    font-family: Georgia, serif;
    font-size: clamp(3rem, 10vw, 8rem);
    color: #c25977;
    margin: 0 0 40px 0;
    text-align: center;
    user-select: none;
    z-index: 10;
    pointer-events: none;
}
.start-btn {
    background-color: #c25977;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 16px 48px;
    font-size: 1.25rem;
    font-weight: 600;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.2s;
    box-shadow: 0 4px 14px rgba(194, 89, 119, 0.25);
    z-index: 10; 
}
.start-btn:hover {
    background-color: #a3425e;
    transform: scale(1.05);
}
.cursor-bird {
    position: absolute;
    width: 150px;
    height: auto;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    opacity: 1;
    transform-origin: center center;
}

/* --- NIEUWE FOTO COLLAGE & POSTZEGEL CSS --- */
.photo-collage {
    /* Masonry layout */
    column-count: 3;
    column-gap: 20px;
    margin-top: 15px;
}
.stamp-wrapper {
    break-inside: avoid;
    margin-bottom: 20px;
    filter: drop-shadow(0 6px 12px rgba(194, 89, 119, 0.15));
    transition: transform 0.2s ease;
    display: inline-block;
    width: 100%;
}
.stamp-wrapper:hover {
    transform: scale(1.02) rotate(-1.5deg);
}
.stamp-card {
    background: white;
    padding: 12px;
    padding-bottom: 42px; /* Ruimte voor de naam */
    position: relative;
    /* CSS magie: maakt perfecte postzegelrandjes! */
    -webkit-mask-image: radial-gradient(circle at 6px 6px, transparent 4px, black 4.5px);
    -webkit-mask-size: 12px 12px;
    -webkit-mask-position: -6px -6px;
    mask-image: radial-gradient(circle at 6px 6px, transparent 4px, black 4.5px);
    mask-size: 12px 12px;
    mask-position: -6px -6px;
}
.stamp-card img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 2px; /* Hele lichte afronding */
    object-fit: cover;
}
.stamp-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: #4a212f;
    font-weight: 700;
}

/* Responsiviteit voor de collage */
@media (max-width: 950px) {
    .photo-collage { column-count: 2; }
}
@media (max-width: 550px) {
    .photo-collage { 
        column-count: 2; 
        column-gap: 12px; 
    }
    .stamp-wrapper { 
        margin-bottom: 12px; 
    }
    .stamp-card {
        padding: 8px;
        padding-bottom: 34px;
        /* Kleinere postzegelrandjes op mobiel */
        -webkit-mask-size: 10px 10px;
        -webkit-mask-position: -5px -5px;
    }
    .stamp-name {
        height: 34px;
        font-size: 12px;
    }
}

<body>

<!-- DE STARTPAGINA met CURSOR EFFECT -->
<div id="start-screen">
    <h1>Mijn Vogelboek</h1>
    <button id="start-btn" class="start-btn">Doorgaan</button>
</div>

<!-- DE APP -->
<div id="app"></div>
<script type="module" src="./app.js?v=6"></script>

<!-- STARTPAGINA & CURSOR LOGICA -->
<script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    
    startBtn.addEventListener('click', function() {
        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.display = 'none';
        }, 500); 
    });

    const birdFiles = [
        'bijeneter.png', 'blauwborst.png', 'flamingo.png', 'geelgord.png',
        'goudvink.png', 'grauwekiekendief.png', 'groenling.png', 'grotebontespecht.png',
        'halsbandparkiet.png', 'huismus.png', 'ijsvogel.png', 'kerkuil.png',
        'kluut.png', 'merel.png', 'roodmus.png', 'smient.png', 'staartmees.png',
        'wielewaal.png', 'zeearend.png', 'zwarteooievaar.png'
    ];

    birdFiles.sort(() => Math.random() - 0.5);

    birdFiles.forEach(file => {
        const img = new Image();
        img.src = `./vogel_tekeningen/${file}`;
    });

    let currentBirdIndex = 0;
    let activeBirds = [];
    let lastSpawnPos = { x: -999, y: -999 };
    const SPAWN_DISTANCE = 120; 
    const MAX_BIRDS = 5; 

    startScreen.addEventListener('mousemove', function(e) {
        handlePointerMove(e.clientX, e.clientY);
    });

    startScreen.addEventListener('touchmove', function(e) {
        const touch = e.touches[0];
        handlePointerMove(touch.clientX, touch.clientY);
    });

    function handlePointerMove(x, y) {
        const dx = x - lastSpawnPos.x;
        const dy = y - lastSpawnPos.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > SPAWN_DISTANCE) {
            lastSpawnPos = { x: x, y: y };
            spawnBird(x, y);
        }
    }

    function spawnBird(x, y) {
        const img = document.createElement('img');
        img.src = `./vogel_tekeningen/${birdFiles[currentBirdIndex]}`;
        img.className = 'cursor-bird';
        
        const rotation = Math.random() * 40 - 20;
        img.style.left = `${x}px`;
        img.style.top = `${y}px`;
        img.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
        
        startScreen.appendChild(img);
        activeBirds.push(img);

        currentBirdIndex = (currentBirdIndex + 1) % birdFiles.length;

        if (activeBirds.length > MAX_BIRDS) {
            const oldBird = activeBirds.shift();
            oldBird.style.opacity = '0';
            oldBird.style.transform = oldBird.style.transform + ' scale(0.8)'; 
            setTimeout(() => {
                if(oldBird.parentNode) oldBird.parentNode.removeChild(oldBird);
            }, 400); 
        }
    }
</script>
